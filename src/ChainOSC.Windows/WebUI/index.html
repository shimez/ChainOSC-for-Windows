<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainOSC for Windows</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1040px;margin:auto}h1{margin:0 0 4px;font-size:28px}h2,h3{margin-top:0}.version,.note{color:#667085}.version{margin:0 0 22px}.card{background:#fff;border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 2px 10px #16203316}.key-card{border-left:5px solid #7446cc}.grid,.sequence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sequence-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.full,.sequence-address{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:6px}input,select,button{width:100%;min-height:42px;border:1px solid #c9d0dc;border-radius:7px;padding:8px 10px;font:inherit}.checks{display:flex;gap:18px;align-items:center;min-height:42px}.checks label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500}.checks input{width:auto;min-height:0}button{cursor:pointer;font-weight:650}.primary{background:#20a94b;color:#fff;border-color:#20a94b}.secondary{background:#2866e8;color:#fff;border-color:#2866e8}.test{background:#fff;color:#2866e8;border-color:#8bb0ff}.danger{background:#fff4f4;color:#d92d20;border-color:#f5b7b1}.key-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.key-head h2{margin:0}.menu-wrap{position:relative}.menu-button{width:44px;font-size:22px}.menu{position:absolute;right:0;top:48px;width:255px;background:#fff;padding:8px;border:1px solid #d0d5dd;border-radius:9px;box-shadow:0 8px 24px #1018282e;z-index:3}.menu button{margin:3px 0;background:#fff;text-align:left}.mode-box,.sequence-box{margin-top:16px;padding:14px;background:#f8fafc;border-radius:10px}.message-summary{display:flex;justify-content:space-between;padding:12px 14px;margin-top:14px;background:#eaf2ff;color:#175cd3;border-radius:9px;font-weight:650}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e9edf3;border-radius:9px;padding:3px;margin:12px 0}.tabs button{border:0;background:transparent}.tabs button.active{background:#fff;box-shadow:0 1px 4px #10182829}.message-row{display:grid;grid-template-columns:64px minmax(240px,2fr) minmax(120px,.8fr) minmax(150px,1fr) 84px;gap:9px;align-items:end;padding:12px;margin-bottom:10px;border:1px solid #dce2ea;border-radius:10px}.move{display:flex;gap:4px}.move button{padding:4px}.add-message{border-style:dashed;color:#2866e8;background:#f8fbff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.save-bar{position:sticky;bottom:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 3px 18px #10182830;margin:18px 0}.toolbar{display:flex;margin-bottom:14px}.toolbar button{max-width:230px}#log{height:150px;overflow:auto;background:#101828;color:#d0d5dd;border-radius:8px;padding:12px;font:13px Consolas,monospace}.line{margin-bottom:5px}.ok{color:#75e0a7}.sent{color:#84caff}.error{color:#fda29b}[hidden]{display:none!important}@media(max-width:760px){body{padding:14px}.grid,.sequence-grid{grid-template-columns:1fr}.full,.sequence-address{grid-column:auto}.message-row{grid-template-columns:52px 1fr}.message-row .field,.message-row .danger{grid-column:2}.checks{flex-wrap:wrap}}
button:disabled{cursor:not-allowed;opacity:.55;background:#e4e7ec!important;color:#98a2b3!important;border-color:#d0d5dd!important}
</style></head><body><main><h1>ChainOSC for Windows</h1><p class="version">v0.3.0 — ChainOSC-compatible Key settings and presets</p><section class="card"><h2>OSC Target</h2><div class="grid"><div><label>Host or IP address</label><input id="host" value="127.0.0.1"></div><div><label>UDP Port</label><input id="port" type="number" min="1" max="65535" value="9000"></div></div></section><div class="toolbar"><button class="secondary" onclick="addKey()">+ Add Key</button></div><div id="keys"></div><div class="save-bar"><button class="primary" onclick="saveSettings()">Save All Settings</button></div><section class="card"><h2>Activity</h2><div id="log"></div></section></main>
<template id="key-template"><section class="card key-card"><div class="key-head"><h2>Key</h2><div class="menu-wrap"><button class="menu-button">…</button><div class="menu" hidden><button class="export-preset">Export Preset (JSON)</button><button class="import-preset">Import Preset (JSON)</button><button class="delete-key danger">Delete Key</button></div><input class="preset-file" type="file" accept="application/json,.json" hidden></div></div><div class="grid"><div class="full"><label>Key Name</label><input class="name" maxlength="64"></div><div><label>Global hotkey</label><select class="hotkey"></select></div><div><label>Modifiers</label><div class="checks"><label><input class="ctrl" type="checkbox">Ctrl</label><label><input class="alt" type="checkbox">Alt</label><label><input class="shift" type="checkbox">Shift</label><label><input class="win" type="checkbox">Win</label></div></div></div><div class="mode-box"><label>Key Mode</label><select class="mode"><option value="pressRelease">Press / Release</option><option value="sequence">Sequence (press only)</option></select></div><div class="press-release"><div class="message-summary"><span class="count">Messages 2 / 8</span><span>Press + Release</span></div><div class="tabs"><button class="press-tab active">Press</button><button class="release-tab">Release</button></div><div class="press-panel"><div class="press-list"></div></div><div class="release-panel" hidden><div class="release-list"></div></div><button class="add-message">+ Add OSC Message</button></div><div class="sequence-box" hidden><h3>Advance the value on each press</h3><p class="note">Move from Start by Step and return to Start after End.</p><div class="sequence-grid"><div class="sequence-address"><label>OSC Address</label><input class="seq-address" maxlength="192"></div><div><label>Start</label><input class="seq-start" type="number" step="any"></div><div><label>End</label><input class="seq-end" type="number" step="any"></div><div><label>Step</label><input class="seq-step" type="number" step="any"></div><div><label>Type</label><select class="seq-type"><option value="float">Float</option><option value="int">Int</option><option value="string">String</option></select></div></div></div><div class="actions"><button class="test press-test">Test Press</button><button class="test release-test">Test Release</button></div></section></template>
<template id="message-template"><div class="message-row"><div class="move"><button class="up">↑</button><button class="down">↓</button></div><div class="field"><label>OSC Address</label><input class="address" maxlength="192"></div><div class="field"><label>Type</label><select class="type"><option value="float">Float</option><option value="int">Int</option><option value="string">String</option></select></div><div class="field"><label>Value</label><input class="value" maxlength="128"></div><button class="danger remove">Delete</button></div></template>
<script>
const keys=document.getElementById('keys');function uid(){return crypto.randomUUID().replaceAll('-','')}function message(value='1'){return{address:'/avatar/parameters/ChainOSCKey',type:'int',value}}function defaultKey(){return{id:uid(),name:'Key '+(keys.children.length+1),hotkey:'F8',ctrl:false,alt:false,shift:false,win:false,mode:'pressRelease',press:[message('1')],release:[message('0')],sequence:{address:'/avatar/parameters/ChainOSCKey',type:'float',start:0,end:10,step:1}}}function fillHotkeys(select){[...Array(12)].forEach((_,i)=>select.add(new Option('F'+(i+1),'F'+(i+1))));'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k=>select.add(new Option(k,k)))}
function addKey(value=defaultKey()){const card=document.getElementById('key-template').content.firstElementChild.cloneNode(true);card.dataset.id=value.id;card.dataset.active='press';const q=s=>card.querySelector(s),set=(s,v)=>q(s).value=v;q('h2').textContent=value.name||'Key';set('.name',value.name);fillHotkeys(q('.hotkey'));set('.hotkey',value.hotkey);['ctrl','alt','shift','win'].forEach(x=>q('.'+x).checked=!!value[x]);set('.mode',typeof value.mode==='string'?value.mode:(value.mode===1?'sequence':'pressRelease'));value.press.forEach(x=>addMessageRow(q('.press-list'),x));value.release.forEach(x=>addMessageRow(q('.release-list'),x));set('.seq-address',value.sequence.address);set('.seq-type',String(value.sequence.type).toLowerCase());set('.seq-start',value.sequence.start);set('.seq-end',value.sequence.end);set('.seq-step',value.sequence.step);q('.name').oninput=e=>q('h2').textContent=e.target.value||'Key';q('.mode').onchange=()=>updateMode(card);q('.press-tab').onclick=()=>selectTab(card,'press');q('.release-tab').onclick=()=>selectTab(card,'release');q('.add-message').onclick=()=>{if(total(card)>=8)return chainOscLog('A Key can contain up to 8 Press + Release messages.','error');addMessageRow(q('.'+card.dataset.active+'-list'),message(card.dataset.active==='press'?'1':'0'));updateCount(card)};q('.menu-button').onclick=()=>q('.menu').hidden=!q('.menu').hidden;q('.delete-key').onclick=()=>{if(confirm('Delete this Key?'))card.remove()};q('.export-preset').onclick=()=>post('exportPreset',card);q('.import-preset').onclick=()=>q('.preset-file').click();q('.preset-file').onchange=async e=>{if(!e.target.files.length)return;if(e.target.files[0].size>16384){chainOscLog('The preset file exceeds 16 KiB.','error');e.target.value='';return}post('importPreset',card,{presetJson:await e.target.files[0].text()});e.target.value=''};q('.press-test').onclick=()=>post('test',card,{pressed:true});q('.release-test').onclick=()=>post('test',card,{pressed:false});keys.append(card);updateMode(card);updateCount(card)}
function addMessageRow(list,value){const row=document.getElementById('message-template').content.firstElementChild.cloneNode(true),q=s=>row.querySelector(s);q('.address').value=value.address;q('.type').value=String(value.type).toLowerCase();q('.value').value=value.value;q('.remove').onclick=()=>{const card=row.closest('.key-card');row.remove();updateCount(card)};q('.up').onclick=()=>{if(row.previousElementSibling)list.insertBefore(row,row.previousElementSibling)};q('.down').onclick=()=>{if(row.nextElementSibling)list.insertBefore(row.nextElementSibling,row)};list.append(row)}
function selectTab(card,event){card.dataset.active=event;card.querySelector('.press-panel').hidden=event!=='press';card.querySelector('.release-panel').hidden=event!=='release';card.querySelector('.press-tab').classList.toggle('active',event==='press');card.querySelector('.release-tab').classList.toggle('active',event==='release')}function total(card){return card.querySelectorAll('.message-row').length}function updateCount(card){card.querySelector('.count').textContent='Messages '+total(card)+' / 8';card.querySelector('.add-message').disabled=total(card)>=8}function updateMode(card){const sequence=card.querySelector('.mode').value==='sequence';card.querySelector('.press-release').hidden=sequence;card.querySelector('.sequence-box').hidden=!sequence;card.querySelector('.release-test').disabled=sequence}
function readMessage(row){return{address:row.querySelector('.address').value.trim(),type:row.querySelector('.type').value,value:row.querySelector('.value').value}}function readKey(card){const q=s=>card.querySelector(s);return{id:card.dataset.id,name:q('.name').value.trim(),hotkey:q('.hotkey').value,ctrl:q('.ctrl').checked,alt:q('.alt').checked,shift:q('.shift').checked,win:q('.win').checked,mode:q('.mode').value,press:[...q('.press-list').children].map(readMessage),release:[...q('.release-list').children].map(readMessage),sequence:{address:q('.seq-address').value.trim(),type:q('.seq-type').value,start:Number(q('.seq-start').value),end:Number(q('.seq-end').value),step:Number(q('.seq-step').value)}}}function readSettings(){return{version:'0.3.0',host:document.getElementById('host').value.trim(),port:Number(document.getElementById('port').value),keys:[...keys.children].map(readKey)}}function post(action,card,extra={}){window.chrome.webview.postMessage({action,settings:readSettings(),keyId:card?.dataset.id,...extra})}function saveSettings(){post('save')}
window.chrome.webview.addEventListener('message',event=>{const data=event.data;if(data?.action==='load'){document.getElementById('host').value=data.settings.host;document.getElementById('port').value=data.settings.port;keys.replaceChildren();data.settings.keys.forEach(addKey)}else if(data?.action==='presetExport'){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([data.json],{type:'application/json'}));link.download=data.fileName;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}});window.chainOscLog=(message,level='')=>{const line=document.createElement('div');line.className='line '+level;line.textContent=new Date().toLocaleTimeString()+'  '+message;const log=document.getElementById('log');log.append(line);log.scrollTop=log.scrollHeight};chainOscLog('Loading saved settings...');
</script><script>
const addKeyWithNativePresetDialogs=addKey;
document.querySelector('.version').textContent='v0.5.0 — Windows startup and single-instance operation';
const applicationCard=document.createElement('section');
applicationCard.className='card';
applicationCard.innerHTML=`<h2>Application</h2>
  <div class="checks" style="display:grid;gap:12px">
    <label><input id="start-with-windows" type="checkbox">Start ChainOSC when I sign in to Windows</label>
    <label><input id="start-minimized" type="checkbox">Start minimized to the system tray when launched at sign-in</label>
  </div>
  <p class="note">Starting with Windows is registered for the current user and does not require administrator rights.</p>`;
document.querySelector('main .card').insertAdjacentElement('beforebegin',applicationCard);
const readSettingsV03=readSettings;
readSettings=function(){
  const settings=readSettingsV03();
  settings.version='0.5.0';
  settings.startWithWindows=document.getElementById('start-with-windows').checked;
  settings.startMinimized=document.getElementById('start-minimized').checked;
  return settings;
};
keys.insertAdjacentElement('afterend',document.querySelector('.toolbar'));
addKey=function(value){
  addKeyWithNativePresetDialogs(value);
  const card=keys.lastElementChild;
  card.querySelector('.import-preset').onclick=()=>post('importPreset',card);
};
window.chrome.webview.addEventListener('message',event=>{
  const data=event.data;
  if(data?.action==='load'){
    document.getElementById('start-with-windows').checked=!!data.settings.startWithWindows;
    document.getElementById('start-minimized').checked=data.settings.startMinimized!==false;
  }
  if(data?.action!=='operationResult')return;
  chainOscLog(data.message,data.success?'ok':'error');
  if(!data.success)alert('Preset operation failed\n\n'+data.message);
});
</script></body></html>
