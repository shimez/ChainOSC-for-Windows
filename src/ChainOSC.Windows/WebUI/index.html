<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainOSC for Windows</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:920px;margin:auto}h1{margin:0 0 4px;font-size:28px}.version{color:#667085;margin:0 0 22px}.card{background:#fff;border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 2px 10px #16203316}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:6px}input,select,button{width:100%;min-height:42px;border:1px solid #c9d0dc;border-radius:7px;padding:8px 10px;font:inherit}.checks{display:flex;gap:18px;align-items:center;min-height:42px}.checks label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500}.checks input{width:auto;min-height:0}button{cursor:pointer;font-weight:650}.primary{background:#2866e8;color:#fff;border-color:#2866e8}.test{background:#fff;color:#2866e8;border-color:#8bb0ff}.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:18px}#log{height:155px;overflow:auto;background:#101828;color:#d0d5dd;border-radius:8px;padding:12px;font:13px Consolas,monospace}.line{margin-bottom:5px}.ok{color:#75e0a7}.sent{color:#84caff}.error{color:#fda29b}.note{color:#667085;font-size:14px;margin:8px 0 0}@media(max-width:680px){body{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr}}
</style></head><body><main>
<h1>ChainOSC for Windows</h1><p class="version">v0.1.0 — global hotkey OSC proof of concept</p>
<section class="card"><h2>OSC Target</h2><div class="grid"><div><label for="host">Host or IP address</label><input id="host" value="127.0.0.1"></div><div><label for="port">UDP Port</label><input id="port" type="number" min="1" max="65535" value="9000"></div></div></section>
<section class="card"><h2>Key</h2><div class="grid"><div><label for="hotkey">Global hotkey</label><select id="hotkey"></select></div><div><label>Modifiers</label><div class="checks"><label><input id="ctrl" type="checkbox">Ctrl</label><label><input id="alt" type="checkbox">Alt</label><label><input id="shift" type="checkbox">Shift</label><label><input id="win" type="checkbox">Win</label></div></div><div class="full"><label for="address">OSC Address</label><input id="address" value="/avatar/parameters/ChainOSCKey"></div><div><label for="type">Type</label><select id="type"><option value="int">Int</option><option value="float">Float</option><option value="string">String</option></select></div><div></div><div><label for="pressValue">Pressed value</label><input id="pressValue" value="1"></div><div><label for="releaseValue">Released value</label><input id="releaseValue" value="0"></div></div><div class="actions"><button class="primary" onclick="apply()">Apply Settings</button><button class="test" onclick="send('testPress')">Test Press</button><button class="test" onclick="send('testRelease')">Test Release</button></div><p class="note">The selected key remains available to other applications. Key repeat sends only one Press event.</p></section>
<section class="card"><h2>Activity</h2><div id="log"></div></section>
</main><script>
const hotkey=document.getElementById('hotkey');[...Array(12)].forEach((_,i)=>hotkey.add(new Option('F'+(i+1),'F'+(i+1))));'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k=>hotkey.add(new Option(k,k)));hotkey.value='F8';
function value(id){return document.getElementById(id).value}function checked(id){return document.getElementById(id).checked}function payload(action){return{action,host:value('host'),port:Number(value('port')),hotkey:value('hotkey'),ctrl:checked('ctrl'),alt:checked('alt'),shift:checked('shift'),win:checked('win'),address:value('address'),type:value('type'),pressValue:value('pressValue'),releaseValue:value('releaseValue')}}function send(action){window.chrome.webview.postMessage(payload(action))}function apply(){send('apply')}
window.chainOscLog=(message,level='')=>{const line=document.createElement('div');line.className='line '+level;line.textContent=new Date().toLocaleTimeString()+'  '+message;const log=document.getElementById('log');log.append(line);log.scrollTop=log.scrollHeight};chainOscLog('Choose a hotkey and click Apply Settings.');
</script></body></html>
