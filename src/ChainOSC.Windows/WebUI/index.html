<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainOSC for Windows</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f3f5f8}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:960px;margin:auto}h1{margin:0 0 4px;font-size:28px}h2{margin-top:0}.version,.note{color:#667085}.version{margin:0 0 22px}.card{background:#fff;border-radius:14px;padding:20px;margin:0 0 16px;box-shadow:0 2px 10px #16203316}.key-card{border-left:5px solid #7446cc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:6px}input,select,button{width:100%;min-height:42px;border:1px solid #c9d0dc;border-radius:7px;padding:8px 10px;font:inherit}.checks{display:flex;gap:18px;align-items:center;min-height:42px}.checks label{display:flex;gap:6px;align-items:center;margin:0;font-weight:500}.checks input{width:auto;min-height:0}button{cursor:pointer;font-weight:650}.primary{background:#20a94b;color:#fff;border-color:#20a94b}.secondary{background:#2866e8;color:#fff;border-color:#2866e8}.test{background:#fff;color:#2866e8;border-color:#8bb0ff}.danger{background:#fff4f4;color:#d92d20;border-color:#f5b7b1}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}.key-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.key-head h2{margin:0}.key-head button{width:auto;padding-inline:18px}.save-bar{position:sticky;bottom:12px;background:#fff;padding:12px;border-radius:12px;box-shadow:0 3px 18px #10182830;margin:18px 0}.toolbar{display:flex;gap:10px}.toolbar button{max-width:230px}#log{height:150px;overflow:auto;background:#101828;color:#d0d5dd;border-radius:8px;padding:12px;font:13px Consolas,monospace}.line{margin-bottom:5px}.ok{color:#75e0a7}.sent{color:#84caff}.error{color:#fda29b}@media(max-width:680px){body{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions{grid-template-columns:1fr}.checks{flex-wrap:wrap}}
</style></head><body><main><h1>ChainOSC for Windows</h1><p class="version">v0.2.0 — multiple global hotkeys with persistent settings</p>
<section class="card"><h2>OSC Target</h2><div class="grid"><div><label for="host">Host or IP address</label><input id="host" value="127.0.0.1"></div><div><label for="port">UDP Port</label><input id="port" type="number" min="1" max="65535" value="9000"></div></div></section>
<div class="toolbar"><button class="secondary" type="button" onclick="addKey()">+ Add Key</button></div><div id="keys"></div>
<div class="save-bar"><button class="primary" type="button" onclick="saveSettings()">Save All Settings</button></div>
<section class="card"><h2>Activity</h2><div id="log"></div></section></main>
<template id="key-template"><section class="card key-card"><div class="key-head"><h2>Key</h2><button class="danger remove" type="button">Delete</button></div><div class="grid"><div class="full"><label>Key Name</label><input class="name" maxlength="64"></div><div><label>Global hotkey</label><select class="hotkey"></select></div><div><label>Modifiers</label><div class="checks"><label><input class="ctrl" type="checkbox">Ctrl</label><label><input class="alt" type="checkbox">Alt</label><label><input class="shift" type="checkbox">Shift</label><label><input class="win" type="checkbox">Win</label></div></div><div class="full"><label>OSC Address</label><input class="address" maxlength="192"></div><div><label>Type</label><select class="type"><option value="int">Int</option><option value="float">Float</option><option value="string">String</option></select></div><div></div><div><label>Pressed value</label><input class="press-value" maxlength="128"></div><div><label>Released value</label><input class="release-value" maxlength="128"></div></div><div class="actions"><button class="test press-test" type="button">Test Press</button><button class="test release-test" type="button">Test Release</button></div><p class="note">The hotkey remains available to other applications. Key repeat sends one Press event.</p></section></template>
<script>
const keys=document.getElementById('keys');let settings={version:'0.2.0',host:'127.0.0.1',port:9000,keys:[]};
function options(select){[...Array(12)].forEach((_,i)=>select.add(new Option('F'+(i+1),'F'+(i+1))));'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(k=>select.add(new Option(k,k)))}
function id(){return crypto.randomUUID().replaceAll('-','')}
function defaultKey(){return{id:id(),name:'Key '+(keys.children.length+1),hotkey:'F8',ctrl:false,alt:false,shift:false,win:false,address:'/avatar/parameters/ChainOSCKey',type:'int',pressValue:'1',releaseValue:'0'}}
function addKey(value=defaultKey()){const node=document.getElementById('key-template').content.firstElementChild.cloneNode(true);node.dataset.id=value.id;node.querySelector('h2').textContent=value.name||'Key';const set=(s,v)=>node.querySelector(s).value=v;set('.name',value.name);options(node.querySelector('.hotkey'));set('.hotkey',value.hotkey);node.querySelector('.ctrl').checked=!!value.ctrl;node.querySelector('.alt').checked=!!value.alt;node.querySelector('.shift').checked=!!value.shift;node.querySelector('.win').checked=!!value.win;set('.address',value.address);set('.type',String(value.type).toLowerCase());set('.press-value',value.pressValue);set('.release-value',value.releaseValue);node.querySelector('.name').addEventListener('input',e=>node.querySelector('h2').textContent=e.target.value||'Key');node.querySelector('.remove').onclick=()=>{if(confirm('Delete this Key?'))node.remove()};node.querySelector('.press-test').onclick=()=>test(node,true);node.querySelector('.release-test').onclick=()=>test(node,false);keys.append(node)}
function readKey(node){const get=s=>node.querySelector(s);return{id:node.dataset.id,name:get('.name').value.trim(),hotkey:get('.hotkey').value,ctrl:get('.ctrl').checked,alt:get('.alt').checked,shift:get('.shift').checked,win:get('.win').checked,address:get('.address').value.trim(),type:get('.type').value,pressValue:get('.press-value').value,releaseValue:get('.release-value').value}}
function readSettings(){return{version:'0.2.0',host:document.getElementById('host').value.trim(),port:Number(document.getElementById('port').value),keys:[...keys.children].map(readKey)}}
function saveSettings(){window.chrome.webview.postMessage({action:'save',settings:readSettings()})}function test(node,pressed){window.chrome.webview.postMessage({action:'test',settings:readSettings(),keyId:node.dataset.id,pressed})}
window.chrome.webview.addEventListener('message',event=>{if(event.data?.action!=='load')return;settings=event.data.settings;document.getElementById('host').value=settings.host;document.getElementById('port').value=settings.port;keys.replaceChildren();settings.keys.forEach(addKey)});
window.chainOscLog=(message,level='')=>{const line=document.createElement('div');line.className='line '+level;line.textContent=new Date().toLocaleTimeString()+'  '+message;const log=document.getElementById('log');log.append(line);log.scrollTop=log.scrollHeight};chainOscLog('Loading saved settings...');
</script></body></html>
