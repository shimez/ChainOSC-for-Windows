<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChainOSC for Windows</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main>
      <h1>ChainOSC for Windows</h1>
      <p class="version">Tauri prototype v0.2.0</p>

      <section class="card">
        <h2>OSC Target</h2>
        <div class="grid two">
          <div><label for="host">Host or IP address</label><input id="host" /></div>
          <div><label for="port">UDP Port</label><input id="port" type="number" min="1" max="65535" /></div>
        </div>
      </section>

      <div id="keys"></div>
      <button id="add-key" class="add-key" type="button">+ Add Key</button>

      <div class="save-bar"><button id="save" class="primary" type="button">Save Settings</button></div>

      <section class="card">
        <h2>Activity</h2>
        <div id="status" class="status">Loading settings...</div>
        <div id="log" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
